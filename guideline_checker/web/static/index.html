<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>guideline-checker · workshop</title>
<script>
  /* Resolve the theme before first paint. The attribute on <html> is only a fallback
     for a browser with scripting off; leaving it to the main script at the end of
     <body> would paint dark first and flash to light for anyone who prefers light. */
  (function () {
    try {
      var saved = localStorage.getItem("gc:theme");
      document.documentElement.dataset.theme =
        (saved === "dark" || saved === "light") ? saved
        : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    } catch (e) { /* storage blocked — the fallback attribute stands */ }
  })();
</script>
<style>
  /* ── Design tokens (Exaggerated Minimalism · Fira · #1E293B/#22C55E/#0F172A) ── */
  :root {
    --ground: #0f172a; --panel: #1e293b; --panel-2: #17212f; --edge: #33425c;
    --ink: #eaf1fa; --ink-dim: #a7b6cd; --ink-faint: #8496af;
    --proven: #22c55e; --armed: #38bdf8; --dead: #fb5f8a; --advisory: #9aa8bf;
    --warn: #e6a531; --accent: #22c55e;
    --mono: "Fira Code", ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: "Fira Sans", "Inter var", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --radius: 10px; --radius-sm: 7px;
    /* Tint behind a chip or the primary button, painted in that element's own hue.
       Tokenised because a light surface needs a weaker one: the tint lightens the
       backdrop about as fast as darkening the text darkens the ink, so on white it
       pins the ratio near 4:1 whatever the palette. Dark keeps 16%; light uses 8%
       (see the light block for the measurements). */
    --tint: 16%; --tint-strong: 26%;
    --sp-1: 0.4rem; --sp-2: 0.7rem; --sp-3: 1rem; --sp-4: 1.4rem; --sp-5: 2rem;
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px -12px rgba(0,0,0,.4);
  }
  /* The light theme failed WCAG AA. These colours carry 0.6rem text (chips, source
     labels, hints) — never large text, so 4.5:1 applies, not 3:1. Measured on the
     rendered page, compositing every alpha layer, worst ratio per element class:

       original palette + 16% tint  -> 2.96   (4 element classes below 4.5)
       original palette +  8% tint  -> 3.26   (3 below)
       darker palette   + 16% tint  -> 4.13   (1 below)
       darker palette   +  8% tint  -> 4.62   (none)          <- shipped

     Neither change carries it alone, which is why both are here. Dark measures 4.53
     worst-case and was already compliant; it is untouched apart from the tint token. */
  :root[data-theme="light"] {
    --ground: #eef2f8; --panel: #ffffff; --panel-2: #f4f7fc; --edge: #b9c5da;
    --ink: #16233b; --ink-dim: #43536e; --ink-faint: #59677c;
    --proven: #0e753b; --armed: #026aa3; --dead: #be145f; --advisory: #59677c;
    --warn: #8b5c17; --accent: #0e753b;
    --shadow: 0 1px 2px rgba(16,32,60,.06), 0 10px 26px -14px rgba(16,32,60,.22);
    --tint: 8%; --tint-strong: 16%;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: var(--armed); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: var(--sp-4) clamp(1rem, 3vw, 2rem) 4rem; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .skip { position: absolute; left: -999px; top: 0.5rem; z-index: 20; background: var(--panel); color: var(--ink); border: 1px solid var(--accent); padding: 0.5rem 0.9rem; border-radius: var(--radius-sm); font-family: var(--mono); font-size: 0.8rem; }
  .skip:focus { left: 0.8rem; }

  /* ── Top bar ── */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-4); }
  .brand { font-family: var(--mono); font-weight: 600; font-size: 1.1rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 0.55rem; margin: 0; }
  .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); flex: none; }
  .brand .sub { color: var(--ink-faint); font-weight: 400; }
  .actions { display: flex; gap: var(--sp-1); align-items: center; flex-wrap: wrap; }
  .btn { font-family: var(--mono); font-size: 0.78rem; font-weight: 600; cursor: pointer; padding: 0.5rem 0.9rem; border-radius: var(--radius-sm); border: 1px solid var(--edge); background: var(--panel); color: var(--ink); transition: border-color .15s, background .15s, color .15s; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn.primary { border-color: color-mix(in srgb, var(--accent) 55%, var(--edge)); background: color-mix(in srgb, var(--accent) var(--tint), transparent); color: var(--accent); }
  .btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) var(--tint-strong), transparent); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.icon { padding: 0.5rem 0.6rem; }
  .select { font-family: var(--mono); font-size: 0.78rem; padding: 0.5rem 0.6rem; border-radius: var(--radius-sm); border: 1px solid var(--edge); background: var(--panel); color: var(--ink); max-width: 240px; cursor: pointer; }

  /* A coarse pointer has no pixel precision: the compact 0.78rem controls measure
     ~32px tall, under the 44px the standard asks for on touch. Only raise them
     where the pointer is actually coarse, so the mouse density is left alone. */
  @media (pointer: coarse) {
    .btn, .select, .rules .resolve, .toolbar input[type=text] { min-height: 44px; }
    .tile { min-height: 44px; }
  }

  /* ── Summary band: grade hero + tiles ── */
  .summary { display: grid; grid-template-columns: auto 1fr; gap: var(--sp-3); align-items: stretch; margin-bottom: var(--sp-2); }
  @media (max-width: 720px) { .summary { grid-template-columns: 1fr; } }
  .grade-hero { display: none; flex-direction: column; justify-content: center; align-items: center; min-width: 128px; padding: var(--sp-3) var(--sp-4); border: 1px solid var(--edge); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); }
  .grade-hero.show { display: flex; }
  .grade-hero .g { font-family: var(--mono); font-weight: 700; font-size: 2.6rem; line-height: 1; }
  .grade-hero .score { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-dim); margin-top: 0.35rem; font-variant-numeric: tabular-nums; }
  .grade-hero .lbl { font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); margin-top: 0.5rem; }
  .gA { color: var(--proven); } .gB { color: var(--armed); } .gC { color: var(--warn); }
  .gD { color: #ef8f4d; } .gF { color: var(--dead); }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-2); }
  @media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
  .tile { background: var(--panel); border: 1px solid var(--edge); border-radius: var(--radius); padding: 0.85rem 1rem; cursor: pointer; text-align: left; transition: border-color .15s, transform .1s; color: var(--ink); }
  .tile:hover, .tile[aria-pressed="true"] { border-color: currentColor; }
  .tile[aria-pressed="true"] { box-shadow: inset 0 0 0 1px currentColor; }
  .tile:active { transform: translateY(1px); }
  .tile .n { font-family: var(--mono); font-size: 1.7rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
  .tile .k { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); margin-top: 0.45rem; display: flex; align-items: center; gap: 0.3rem; }
  .tile .k::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: currentColor; }
  .tile.proven { color: var(--proven); } .tile.armed { color: var(--armed); }
  .tile.dead { color: var(--dead); } .tile.advisory { color: var(--advisory); }
  .tile .n { color: var(--ink); }

  .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; border: 1px solid var(--edge); margin: var(--sp-2) 0 0.6rem; }
  .bar i { display: block; }
  .bar .s-dead { background: var(--dead); } .bar .s-advisory { background: var(--advisory); } .bar .s-armed { background: var(--armed); } .bar .s-proven { background: var(--proven); }
  .stamp { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-dim); margin: 0 0 var(--sp-5); }

  h2 { font-family: var(--mono); font-size: 0.9rem; font-weight: 600; letter-spacing: 0.02em; margin: 0 0 0.7rem; color: var(--ink-dim); }
  .layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: var(--sp-4); align-items: start; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }

  /* ── Toolbar ── */
  .toolbar { display: flex; gap: var(--sp-1); margin: 0 0 var(--sp-2); }
  .toolbar[hidden] { display: none; }
  .toolbar #q { flex: 1; width: auto; }
  .toolbar .select { max-width: none; }

  /* ── Rows (rules / projects) ── */
  .rules { border: 1px solid var(--edge); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
  .rules .row { display: grid; grid-template-columns: auto 1fr auto; gap: 0.8rem; align-items: center; padding: 0.6rem 0.85rem; border-bottom: 1px solid color-mix(in srgb, var(--edge) 55%, transparent); cursor: pointer; color: inherit; text-decoration: none; }
  .rules .row:last-child { border-bottom: none; }
  .rules .row:hover, .rules .row:focus-visible { background: var(--panel-2); }
  .chip { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.07em; text-transform: uppercase; padding: 0.2rem 0.45rem; border-radius: 5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 0.28rem; }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: currentColor; flex: none; }
  .chip.proven { color: var(--proven); background: color-mix(in srgb, var(--proven) var(--tint), transparent); }
  .chip.armed { color: var(--armed); background: color-mix(in srgb, var(--armed) var(--tint), transparent); }
  .chip.dead { color: var(--dead); background: color-mix(in srgb, var(--dead) var(--tint), transparent); }
  .chip.advisory { color: var(--advisory); background: color-mix(in srgb, var(--advisory) var(--tint), transparent); }
  .rules .rule { font-size: 0.85rem; }
  .rules .src { font-family: var(--mono); font-size: 0.64rem; color: var(--ink-faint); margin-top: 0.15rem; }
  .rules .kind { color: var(--armed); }
  .rules .fires { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .rules .resolve { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.3rem 0.6rem; border-radius: 6px; border: 1px solid var(--armed); background: color-mix(in srgb, var(--armed) var(--tint), transparent); color: var(--armed); cursor: pointer; white-space: nowrap; }
  .rules .resolve:hover:not(:disabled) { background: color-mix(in srgb, var(--armed) var(--tint-strong), transparent); }
  .rules .resolve:disabled { opacity: 0.6; cursor: default; }

  /* Row grade chip (all-projects view) */
  .grade { font-family: var(--mono); font-weight: 700; font-size: 0.7rem; letter-spacing: 0.03em; padding: 0.16rem 0.5rem; border-radius: 6px; white-space: nowrap; }
  .grade.gA { background: color-mix(in srgb, var(--proven) var(--tint), transparent); }
  .grade.gB { background: color-mix(in srgb, var(--armed) var(--tint), transparent); }
  .grade.gC { background: color-mix(in srgb, var(--warn) var(--tint), transparent); }
  .grade.gD { background: color-mix(in srgb, #ef8f4d var(--tint), transparent); }
  .grade.gF { background: color-mix(in srgb, var(--dead) var(--tint), transparent); }

  /* ── States (loading / empty / error) ── */
  .state { padding: 1.6rem 1.4rem; color: var(--ink-dim); font-family: var(--mono); font-size: 0.8rem; text-align: center; }
  .state .hint { color: var(--ink-faint); font-size: 0.72rem; margin-top: 0.4rem; }
  .state.error { color: var(--dead); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid color-mix(in srgb, var(--accent) 35%, transparent); border-top-color: var(--accent); border-radius: 50%; vertical-align: -2px; margin-right: 0.5rem; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Workshop panel ── */
  .panel { background: var(--panel); border: 1px solid var(--edge); border-radius: var(--radius); padding: var(--sp-3) 1.1rem; position: sticky; top: 1rem; box-shadow: var(--shadow); }
  .panel label { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); display: block; margin-bottom: 0.4rem; }
  textarea, input[type=text] { width: 100%; font-family: var(--mono); font-size: 0.82rem; background: var(--panel-2); border: 1px solid var(--edge); border-radius: var(--radius-sm); color: var(--ink); padding: 0.55rem 0.65rem; resize: vertical; }
  textarea::placeholder, input::placeholder { color: var(--ink-faint); }
  .field { margin-bottom: 0.8rem; }
  /* ── Folder browser dialog ── */
  .browser { width: min(560px, 92vw); max-height: 80vh; padding: 0; border: 1px solid var(--edge); border-radius: var(--radius); background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  .browser::backdrop { background: rgba(0,0,0,.5); }
  .browser-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: var(--sp-3) 1.1rem; border-bottom: 1px solid var(--edge); }
  .browser-head h2 { font-size: 0.95rem; margin: 0; }
  .browser-cwd { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-dim); padding: 0.6rem 1.1rem 0; word-break: break-all; }
  .browser-list { padding: 0.5rem 0.6rem; overflow-y: auto; max-height: 48vh; }
  .browser-list .entry { display: flex; align-items: center; gap: 0.55rem; width: 100%; text-align: left; font-family: var(--mono); font-size: 0.8rem; padding: 0.5rem 0.6rem; border: none; border-radius: var(--radius-sm); background: none; color: var(--ink); cursor: pointer; }
  .browser-list .entry:hover, .browser-list .entry:focus-visible { background: var(--panel-2); }
  .browser-list .entry .ico { color: var(--ink-faint); flex: none; }
  .browser-list .entry.up { color: var(--ink-dim); }
  .browser-list .empty { padding: 0.8rem 0.6rem; font-size: 0.8rem; color: var(--ink-faint); }
  .browser-foot { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: var(--sp-3) 1.1rem; border-top: 1px solid var(--edge); }
  .browser-hint { font-family: var(--mono); font-size: 0.68rem; color: var(--ink-dim); }
  .browser-hint.ok { color: var(--proven); }
  .proof { margin-top: 0.9rem; font-size: 0.82rem; }
  .proof .head { font-family: var(--mono); font-size: 0.76rem; color: var(--ink-dim); margin-bottom: 0.5rem; }
  .proof .head b { color: var(--ink); }
  .proof .src-tag { color: var(--accent); }
  .hits { max-height: 240px; overflow-y: auto; border: 1px solid var(--edge); border-radius: var(--radius-sm); }
  .hit { display: grid; grid-template-columns: auto 1fr; gap: 0.6rem; padding: 0.4rem 0.6rem; border-bottom: 1px solid color-mix(in srgb, var(--edge) 45%, transparent); font-family: var(--mono); font-size: 0.72rem; }
  .hit:last-child { border-bottom: none; }
  .hit .loc { color: var(--ink-faint); white-space: nowrap; }
  .hit .ex { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note { font-family: var(--mono); font-size: 0.76rem; color: var(--ink-dim); padding: 0.6rem 0.7rem; border: 1px dashed var(--edge); border-radius: var(--radius-sm); margin-top: 0.7rem; }
  .note.ok { color: var(--proven); border-color: color-mix(in srgb, var(--proven) 45%, var(--edge)); }
  .note.bad { color: var(--dead); border-color: color-mix(in srgb, var(--dead) 45%, var(--edge)); }
  pre.diff { margin: 0.6rem 0 0; padding: 0.7rem; overflow-x: auto; font-family: var(--mono); font-size: 0.72rem; background: var(--panel-2); border: 1px solid var(--edge); border-radius: var(--radius-sm); white-space: pre; }
  pre.diff .add { color: var(--proven); } pre.diff .del { color: var(--dead); }

  /* ── Toast ── */
  .toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--accent); color: var(--ink); font-family: var(--mono); font-size: 0.78rem; padding: 0.55rem 1rem; border-radius: 8px; box-shadow: var(--shadow); opacity: 0; transition: opacity .2s; pointer-events: none; max-width: min(90vw, 520px); }
  .toast.show { opacity: 1; }
  .toast.err { border-color: var(--dead); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<a class="skip" href="#rules-title" data-i18n="skip">Skip to results</a>
<div class="wrap">
  <header class="topbar">
    <h1 class="brand"><span class="dot" aria-hidden="true"></span>guideline-checker <span class="sub" data-i18n="brand_sub">· workshop</span></h1>
    <div class="actions" role="group" aria-label="Scan controls" data-i18n-attr="aria-label:aria_scan_controls">
      <label class="sr-only" for="project" data-i18n="project_label">Project to scan</label>
      <select class="select" id="project" title="Project to scan" data-i18n-attr="title:project_label"></select>
      <button class="btn" id="browse" type="button" title="Browse for any folder to scan" data-i18n="browse" data-i18n-attr="title:browse_title">Browse…</button>
      <button class="btn icon" id="theme" type="button" aria-label="Toggle light or dark theme" data-i18n-attr="aria-label:theme_toggle"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 0 0 13z" fill="currentColor"/></svg></button>
      <button class="btn icon" id="lang" type="button" aria-label="Switch language" data-i18n-attr="aria-label:lang_toggle"></button>
      <button class="btn primary" id="scan" type="button" data-i18n="scan">Scan</button>
    </div>
  </header>

  <section class="summary" aria-labelledby="summary-h">
    <h2 id="summary-h" class="sr-only" data-i18n="summary_h">Compliance and rule health</h2>
    <div class="grade-hero" id="grade-hero" title="Compliance grade for the current view" aria-live="polite"></div>
    <div class="tiles" id="tiles" role="group" aria-label="Rule health states — activate to filter" data-i18n-attr="aria-label:tiles_aria"></div>
  </section>
  <div class="bar" id="bar" role="img" aria-label="Rule health distribution" data-i18n-attr="aria-label:bar_aria"></div>
  <p class="stamp" id="stamp" aria-live="polite" data-i18n="not_scanned">Not scanned yet.</p>

  <main class="layout">
    <section aria-labelledby="rules-title">
      <h2 id="rules-title" data-i18n="rules">Rules</h2>
      <div class="toolbar" id="toolbar" hidden role="search">
        <label class="sr-only" for="q" data-i18n="filter_rows">Filter rows</label>
        <input type="text" id="q" placeholder="filter…" autocomplete="off">
        <label class="sr-only" for="sort" data-i18n="sort_rows">Sort rows</label>
        <select class="select" id="sort" title="Sort rows" data-i18n-attr="title:sort_rows"></select>
      </div>
      <div class="rules" id="rules" aria-live="polite" aria-busy="false">
        <div class="state" data-i18n="rules_hint_load">Scan the repository to load rule health.</div>
      </div>
    </section>

    <section aria-labelledby="workshop-title">
      <h2 id="workshop-title" data-i18n="workshop_title">Workshop — propose &amp; prove</h2>
      <div class="panel">
        <div class="field">
          <label for="rule" data-i18n="rule_text">Rule text</label>
          <textarea id="rule" rows="3" placeholder="e.g. Never unpickle untrusted data" data-i18n-attr="placeholder:rule_ph"></textarea>
        </div>
        <button class="btn primary" id="propose" type="button" style="width:100%" data-i18n="propose">Propose &amp; replay</button>
        <button class="btn" id="interpret" type="button" style="width:100%;margin-top:.5rem" title="Derive detectors for this project's advisory prose (LLM, bounded)" data-i18n="interpret" data-i18n-attr="title:interpret_title">Interpret advisory prose →</button>
        <div id="result" aria-live="polite"></div>
      </div>
    </section>
  </main>
</div>
<dialog class="browser" id="browser" aria-labelledby="browser-title">
  <form method="dialog" class="browser-head">
    <h2 id="browser-title" data-i18n="browser_title">Choose a folder to scan</h2>
    <button class="btn icon" value="cancel" aria-label="Close folder browser" data-i18n-attr="aria-label:browser_close">✕</button>
  </form>
  <p class="browser-cwd" id="browser-cwd" aria-live="polite"></p>
  <div class="browser-list" id="browser-list" role="listbox" aria-label="Sub-folders" aria-busy="false" data-i18n-attr="aria-label:browser_subfolders"></div>
  <div class="browser-foot">
    <span class="browser-hint" id="browser-hint"></span>
    <button class="btn primary" id="browser-scan" type="button" data-i18n="browser_scan">Scan this folder</button>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const STATES = ["dead", "advisory", "armed", "proven"];
let health = [];
let activeFilter = null;
let lastProposal = null;
let viewMode = "single";     // "single" (rules) | "all" (projects)
let allProjects = [];        // cached fleet payload for client-side sort/filter

const LANG_KEY = "gc:lang";

function preferredLang() {
  const saved = localStorage.getItem(LANG_KEY);
  if (saved === "fr" || saved === "en") return saved;  // a stale value is discarded
  return (navigator.language || "en").toLowerCase().startsWith("fr") ? "fr" : "en";
}
let LANG = preferredLang();

function t(key, vars) {
  let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
  if (vars) for (const k in vars) s = s.replaceAll("{" + k + "}", vars[k]);
  return s;
}

function applyStaticI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-attr]").forEach((el) => {
    el.dataset.i18nAttr.split(";").forEach((pair) => {
      const [attr, key] = pair.split(":");
      if (attr && key) el.setAttribute(attr.trim(), t(key.trim()));
    });
  });
  $("grade-hero").setAttribute("title", t("grade_hero_title"));
  $("lang").textContent = LANG.toUpperCase();
}

function applyLang(lang) {
  LANG = lang;
  applyStaticI18n();
  if (!$("toolbar").hidden) showToolbar(viewMode);  // re-render sort labels + placeholder
  viewMode === "all" ? renderAllRows() : renderRules();
}

// ── Reusable view states (loading / empty / error) ──────────────────────────
function showLoading(msg) { const el = $("rules"); el.setAttribute("aria-busy", "true"); el.innerHTML = `<div class="state"><span class="spinner" aria-hidden="true"></span>${esc(msg)}</div>`; }
function showEmpty(msg, hint) { $("rules").setAttribute("aria-busy", "false"); $("rules").innerHTML = `<div class="state">${esc(msg)}${hint ? `<div class="hint">${esc(hint)}</div>` : ""}</div>`; }
function showRowsError(msg) { $("rules").setAttribute("aria-busy", "false"); $("rules").innerHTML = `<div class="state error">⚠ ${esc(msg)}<div class="hint">${esc(t("press_scan_retry", { scan: t("scan") }))}</div></div>`; }

function authHeaders(extra) {
  const headers = Object.assign({}, extra || {});
  const key = sessionStorage.getItem("gc-api-key");
  if (key) headers["X-Api-Key"] = key;
  return headers;
}
async function api(path, opts) {
  opts = opts || {};
  let res = await fetch(path, Object.assign({}, opts, { headers: authHeaders(opts.headers) }));
  if (res.status === 401) {
    const key = prompt(t("api_key_prompt"));
    if (key) {
      sessionStorage.setItem("gc-api-key", key);
      res = await fetch(path, Object.assign({}, opts, { headers: authHeaders(opts.headers) }));
    }
  }
  if (!res.ok) throw new Error(`${path} → ${res.status}`);
  return res.json();
}
function toast(msg, isError) {
  const t = $("toast"); t.textContent = msg; t.classList.toggle("err", !!isError); t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

// ── Theme: OS default, user override, persisted, synced across tabs ──────────
// The toggle used to flip a DOM attribute and nothing else: every reload threw the
// choice away and returned to dark, whatever the OS said. The standard asks for the
// OS preference as the default, an override that survives reload, and a change that
// propagates to the app's other tabs and on refocus.
const THEME_KEY = "gc:theme";

function preferredTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === "dark" || saved === "light") return saved;  // a stale value is discarded
  return matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
}
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $("theme").setAttribute("aria-pressed", String(theme === "light"));
}

applyTheme(preferredTheme());

$("theme").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
});
// Another tab changed it, or the OS did while this tab was hidden.
addEventListener("storage", (e) => { if (e.key === THEME_KEY) applyTheme(preferredTheme()); });
addEventListener("focus", () => applyTheme(preferredTheme()));
matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => {
  if (!localStorage.getItem(THEME_KEY)) applyTheme(preferredTheme());  // no override = follow the OS
});

// ── Language: browser default, user override, persisted, synced across tabs ───
applyStaticI18n();  // paint the static UI in the resolved language before first render
$("lang").addEventListener("click", () => {
  const next = LANG === "fr" ? "en" : "fr";
  localStorage.setItem(LANG_KEY, next);
  applyLang(next);
});
addEventListener("storage", (e) => { if (e.key === LANG_KEY) applyLang(preferredLang()); });

// ── Toolbar (filter + sort) ─────────────────────────────────────────────────
function showToolbar(mode) {
  if (mode !== viewMode) $("q").value = "";  // a rule filter is meaningless in the project view
  viewMode = mode;
  const sel = $("sort");
  sel.innerHTML = Object.entries(SORTS[mode]).map(([k, o]) => `<option value="${k}"${k === sortKey[mode] ? " selected" : ""}>↕ ${esc(t(o.label))}</option>`).join("");
  $("q").placeholder = mode === "all" ? t("filter_projects_ph") : t("filter_rules_ph");
  $("toolbar").hidden = false;
}

// ── URL-addressable navigation (deep-link · reload · Back/Forward) ───────────
$("scan").addEventListener("click", () => applyRoute(true));
$("project").addEventListener("change", () => setRoute($("project").value));
$("browse").addEventListener("click", openBrowser);
$("browser-scan").addEventListener("click", () => {
  const dlg = $("browser");
  if (typeof dlg.close === "function") dlg.close(); else dlg.removeAttribute("open");
  if (browseCwd) runScanFolder(browseCwd);
});
window.addEventListener("hashchange", () => applyRoute(false));

function setRoute(value) {
  const h = value === "__all__" ? "all" : "p=" + encodeURIComponent(value);
  if (location.hash === "#" + h) { applyRoute(true); } else { location.hash = h; }
}
async function applyRoute(force) {
  const raw = location.hash.slice(1);
  const sel = $("project");
  if (raw === "all") { sel.value = "__all__"; return runScanAll(force); }
  if (raw.startsWith("p=")) {
    const name = decodeURIComponent(raw.slice(2));
    if ([...sel.options].some((o) => o.value === name)) { sel.value = name; return runScan(name); }
  }
  return force ? runScan() : pollHealth(null).catch(() => showRowsError(t("could_not_load")));
}

async function runScan(project) { return _scan(project ? { project } : null, t("scanning_project")); }
async function runScanFolder(path) { return _scan({ path }, t("scanning_folder")); }

async function _scan(payload, msg) {
  $("scan").disabled = true; $("scan").textContent = t("scanning");
  showLoading(msg);
  try {
    const prev = (await api("/api/rules-health").catch(() => ({}))).timestamp || null;
    const body = payload ? { headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) } : {};
    await api("/api/scan", Object.assign({ method: "POST" }, body));
    await pollHealth(prev);
  } catch (e) { showRowsError(e.message); toast(e.message, true); }
  finally { $("scan").disabled = false; $("scan").textContent = t("scan"); }
}

// ── Folder browser ────────────────────────────────────────────────────────────
let browseCwd = null;

async function loadBrowse(path) {
  const list = $("browser-list");
  list.setAttribute("aria-busy", "true");
  let d;
  try { d = await api("/api/browse" + (path ? "?path=" + encodeURIComponent(path) : "")); }
  catch (e) { toast(e.message, true); list.setAttribute("aria-busy", "false"); return; }
  browseCwd = d.cwd;
  $("browser-cwd").textContent = d.cwd;
  const hint = $("browser-hint");
  hint.textContent = d.scannable ? t("browser_scannable") : t("browser_not_scannable");
  hint.classList.toggle("ok", !!d.scannable);
  const rows = [];
  if (d.parent) rows.push(`<button class="entry up" type="button" data-path="${esc(d.parent)}"><span class="ico" aria-hidden="true">↰</span>..</button>`);
  for (const e of d.entries) rows.push(`<button class="entry" type="button" data-path="${esc(e.path)}"><span class="ico" aria-hidden="true">▸</span>${esc(e.name)}</button>`);
  list.innerHTML = rows.length ? rows.join("") : `<div class="empty">${esc(t("browser_empty"))}</div>`;
  list.setAttribute("aria-busy", "false");
  list.querySelectorAll(".entry").forEach((el) => el.addEventListener("click", () => loadBrowse(el.dataset.path)));
}

function openBrowser() {
  const dlg = $("browser");
  loadBrowse(null);
  if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
}

async function runScanAll(force) {
  // Reuse the cached fleet scan when returning to this view, so navigation is instant.
  if (!force) {
    const cached = await api("/api/health-all").catch(() => ({}));
    if (!cached.running && cached.projects && cached.projects.length) { renderAll(cached); return; }
  }
  $("scan").disabled = true; $("scan").textContent = t("scanning_fleet");
  showLoading(t("scanning_every"));
  try {
    await api("/api/scan-all", { method: "POST" });
    for (let i = 0; i < 240; i++) {
      const d = await api("/api/health-all");
      if (!d.running && d.projects && d.projects.length) { renderAll(d); return; }
      await new Promise((r) => setTimeout(r, 1000));
    }
    showRowsError(t("fleet_timeout"));
  } catch (e) { showRowsError(e.message); toast(e.message, true); }
  finally { $("scan").disabled = false; $("scan").textContent = t("scan"); }
}

// ── Compliance grade hero ────────────────────────────────────────────────────
function setGrade(c) {
  const el = $("grade-hero");
  if (!c || !c.grade || c.grade === "n/a") { el.className = "grade-hero"; el.innerHTML = ""; el.removeAttribute("title"); return; }
  el.className = `grade-hero show g${c.grade}`;
  el.innerHTML = `<div class="g">${c.grade}</div>${c.score != null ? `<div class="score">${c.score}/100</div>` : ""}<div class="lbl">${esc(t("compliance"))}</div>`;
  el.title = `${t("compliance")} ${c.grade}${c.score != null ? ` (${c.score}/100)` : ""} — ${c.errors || 0} error(s), ${c.warnings || 0} warning(s)`;
}

// ── Health tiles + distribution bar ──────────────────────────────────────────
function renderTiles(counts, clickable) {
  const total = STATES.reduce((n, k) => n + (counts[k] || 0), 0) || 1;
  $("tiles").innerHTML = STATES.map((k) => {
    const n = counts[k] || 0;
    const attrs = clickable ? ` type="button" data-state="${k}" aria-pressed="${activeFilter === k}"` : ` type="button" disabled aria-hidden="true"`;
    return `<button class="tile ${k}"${attrs}><div class="n">${n}</div><div class="k">${k}</div></button>`;
  }).join("");
  $("bar").innerHTML = STATES.map((k) => `<i class="s-${k}" style="width:${((counts[k] || 0) / total) * 100}%"></i>`).join("");
  $("bar").setAttribute("aria-label", `Rule health: ${STATES.map((k) => `${counts[k] || 0} ${k}`).join(", ")}`);
  if (clickable) {
    document.querySelectorAll("#tiles .tile").forEach((el) =>
      el.addEventListener("click", () => { activeFilter = activeFilter === el.dataset.state ? null : el.dataset.state; renderRules(); syncTiles(); }));
  }
}
function syncTiles() {
  document.querySelectorAll("#tiles .tile").forEach((el) =>
    el.setAttribute("aria-pressed", String(activeFilter === el.dataset.state)));
}

// ── Single-project view ──────────────────────────────────────────────────────
function render(d) {
  health = d.rules || [];
  setGrade(d.compliance);
  const stamp = d.timestamp ? t("scanned_at", { t: fmtTime(d.timestamp) }) : t("scanned");
  $("stamp").textContent = d.resolvable ? t("resolvable_suffix", { stamp, n: d.resolvable }) : stamp;
  renderTiles(d.summary || {}, true);
  showToolbar("single");
  renderRules();
}

function renderRules() {
  $("rules").setAttribute("aria-busy", "false");
  const term = $("q").value.trim().toLowerCase();
  let rows = activeFilter ? health.filter((r) => r.state === activeFilter) : health.slice();
  if (term) rows = rows.filter((r) => r.rule.toLowerCase().includes(term) || r.instruction.toLowerCase().includes(term) || (r.provenance || "").toLowerCase().includes(term));
  rows.sort(SORTS.single[sortKey.single].cmp);
  const label = activeFilter ? `${t("rules")} · ${activeFilter}` : t("rules");
  $("rules-title").textContent = `${label} (${rows.length}${rows.length !== health.length ? "/" + health.length : ""})`;
  if (!health.length) { showEmpty(t("no_rules_found"), t("no_rules_hint")); return; }
  if (!rows.length) { showEmpty(t("no_rules_match")); return; }
  $("rules").innerHTML = rows.slice(0, 300).map((r) =>
    `<div class="row" data-rule="${esc(r.rule)}" role="button" tabindex="0" aria-label="${esc(r.state)}: ${esc(r.rule)} — ${esc(t("row_load_hint"))}">
       <span class="chip ${r.state}">${r.state}</span>
       <div><div class="rule">${esc(r.rule)}</div><div class="src">${esc(r.instruction)}${r.kind && r.kind !== "advisory" ? ` · <span class="kind">${esc(r.kind)}</span>` : ""}${r.provenance ? ` · from “${esc(r.provenance)}”` : ""}</div></div>
       ${r.resolvable ? `<button class="resolve" data-rule="${esc(r.rule)}" title="${esc(t("resolve_title"))}">${esc(t("resolve"))}</button>` : `<span class="fires">${r.fire_count ? "×" + r.fire_count : ""}</span>`}
     </div>`).join("");
  document.querySelectorAll("#rules .row").forEach((el) => {
    const open = () => { $("rule").value = el.dataset.rule; $("rule").focus(); };
    el.addEventListener("click", open);
    el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
  document.querySelectorAll("#rules .resolve").forEach((btn) =>
    btn.addEventListener("click", (e) => { e.stopPropagation(); resolveRule(btn.dataset.rule, btn); }));
}

// ── All-projects (fleet) view ────────────────────────────────────────────────
function renderAll(d) {
  allProjects = d.projects || [];
  setGrade(d.compliance);
  $("stamp").textContent = d.timestamp ? t("fleet_scanned_at", { t: fmtTime(d.timestamp) }) : t("fleet");
  renderTiles(d.combined || {}, false);
  showToolbar("all");
  renderAllRows();
}

function renderAllRows() {
  $("rules").setAttribute("aria-busy", "false");
  const term = $("q").value.trim().toLowerCase();
  let projects = allProjects.slice();
  if (term) projects = projects.filter((p) => (p.name || "").toLowerCase().includes(term) || ((p.compliance || {}).grade || "").toLowerCase() === term);
  projects.sort(SORTS.all[sortKey.all].cmp);
  $("rules-title").textContent = `Projects (${projects.length}${projects.length !== allProjects.length ? "/" + allProjects.length : ""})`;
  if (!projects.length) { showEmpty(t("no_projects_match")); return; }
  $("rules").innerHTML = projects.map((p) => {
    if (p.error) return `<div class="row"><span class="chip dead">${esc(t("error_grade"))}</span><div><div class="rule">${esc(p.name)}</div><div class="src">${esc(p.error)}</div></div></div>`;
    const s = p.summary || {};
    const g = p.compliance || {};
    const gradeChip = g.grade && g.grade !== "n/a" ? `<span class="grade g${g.grade}">${g.grade}${g.score != null ? " · " + g.score : ""}</span>` : `<span class="chip advisory">${esc(t("na"))}</span>`;
    const badges = STATES.filter((k) => s[k]).map((k) => `<span class="chip ${k}">${k} ${s[k]}</span>`).join(" ");
    return `<a class="row" href="#p=${encodeURIComponent(p.name)}" aria-label="${esc(t("open_project", { name: p.name, grade: (g.grade || t("na")) }))}">${gradeChip}<div><div class="rule">${esc(p.name)}</div><div class="src">${badges}${p.resolvable ? ` · <b>${p.resolvable}</b> resolvable` : ""}</div></div><span class="fires" aria-hidden="true"><svg viewBox="0 0 16 16" width="12" height="12" focusable="false"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>`;
  }).join("");
  // The row is a real link, so keyboard activation, middle-click and cmd-click come
  // from the browser and the existing hashchange handler routes it. One case a link
  // cannot cover: re-selecting the project already in the hash fires no hashchange,
  // and setRoute forced a rescan there.
  document.querySelectorAll("#rules a.row").forEach((el) => {
    el.addEventListener("click", (e) => {
      if (el.getAttribute("href") === location.hash) { e.preventDefault(); applyRoute(true); }
    });
  });
}

async function loadProjects() {
  try {
    const d = await api("/api/projects");
    const sel = $("project");
    if (!d.projects || !d.projects.length) { sel.style.display = "none"; return; }
    const opts = d.projects
      .map((p) => `<option value="${esc(p.name)}"${p.path === d.active ? " selected" : ""}>${esc(p.name)}</option>`)
      .join("");
    sel.innerHTML = `<option value="__all__">${esc(t("all_projects", { n: d.projects.length }))}</option>` + opts;
  } catch { $("project").style.display = "none"; }
}

async function pollHealth(prev) {
  for (let i = 0; i < 60; i++) {
    const d = await api("/api/rules-health");
    if (d.timestamp && d.timestamp !== (prev ?? null) && d.total_rules > 0) { render(d); return; }
    await new Promise((r) => setTimeout(r, 500));
  }
}

// ── Verbose one-click resolution: narrate derive → prove → arm ───────────────
function resolveStep(rule, lines) {
  $("result").innerHTML = `<div class="proof"><div class="head">${t("resolving_head", { rule: esc(rule) })}</div>${lines.join("")}</div>`;
}
function wireRePropose(rule, btn) {
  const el = $("re-propose");
  if (el) el.addEventListener("click", () => resolveRule(rule, btn));
}
async function resolveRule(rule, btn) {
  btn.disabled = true; btn.textContent = t("resolving");
  $("rule").value = rule;
  resolveStep(rule, [`<div class="note"><span class="spinner" aria-hidden="true"></span>${t("derive_step")}</div>`]);
  try {
    const d = await api("/api/rules/resolve", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rule, dry_run: true }),   // preview: derive + prove, write nothing
    });
    if (!d.resolved) {
      // The LLM is non-deterministic — offer an inline re-propose (another attempt).
      resolveStep(rule, [
        `<div class="note bad">${t("no_detector", { reason: esc(d.reason || t("not_detectable")) })}</div>`,
        `<button class="btn primary" id="re-propose" type="button" style="width:100%">${esc(t("re_propose"))}</button>`,
      ]);
      wireRePropose(rule, btn);
      btn.textContent = t("resolve"); btn.disabled = false; return;
    }
    const patterns = [...(d.proposal.forbid || []), ...(d.proposal.forbid_regex || []).map((r) => r + " (regex)"), ...(d.proposal.file_regex || []).map((r) => r + " (file)")];
    const hitRows = (d.proof.hits || []).slice(0, 40).map((h) =>
      `<div class="hit"><span class="loc">${esc(h.file)}:${h.line}</span><span class="ex">${esc(h.excerpt)}</span></div>`).join("");
    const base = [
      `<div class="note">${t("proposed_by", { source: esc(d.proposal.source), patterns: esc(JSON.stringify(patterns)) })}${d.proposal.rationale ? `<br><span class="src">${esc(d.proposal.rationale)}</span>` : ""}</div>`,
      `<div class="head" style="margin-top:.6rem">${t("proven_head", { n: d.proof.match_count, files: d.proof.files_scanned })}</div>`,
      `<div class="hits">${hitRows || `<div class="state">${esc(t("no_matches"))}</div>`}</div>`,
    ];
    if (!d.armed) {
      resolveStep(rule, [...base,
        `<div class="note">${t("step_proved_only", { note: esc(d.note || t("markdown_sourced")) })}</div>`,
        `<button class="btn" id="re-propose" type="button" style="width:100%">${esc(t("re_propose_try"))}</button>`,
      ]);
      wireRePropose(rule, btn);
      btn.textContent = t("resolve"); btn.disabled = false; return;
    }
    resolveStep(rule, [...base, `<div class="note">${t("step_ready_arm", { file: esc(d.file) })}</div><button class="btn primary" id="arm-confirm" type="button" style="width:100%">${esc(t("arm_this_rule"))}</button>`]);
    $("arm-confirm").addEventListener("click", async () => {
      $("arm-confirm").disabled = true; $("arm-confirm").textContent = t("arming");
      try {
        await api("/api/rules/resolve", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ rule, dry_run: false }) });
        resolveStep(rule, [...base, `<div class="note ok">${t("step_armed", { file: esc(d.file) })}</div>`]);
        btn.textContent = t("armed_ok");
        runScan($("project").value && $("project").value !== "__all__" ? $("project").value : undefined);
      } catch (e) { toast(e.message, true); $("arm-confirm").disabled = false; $("arm-confirm").textContent = t("arm_this_rule"); }
    });
  } catch (e) {
    resolveStep(rule, [`<div class="note bad">✗ ${esc(e.message)}</div>`, `<button class="btn primary" id="re-propose" type="button" style="width:100%">${esc(t("re_propose"))}</button>`]);
    wireRePropose(rule, btn);
    btn.textContent = t("resolve"); btn.disabled = false;
  }
}

// ── Workshop: propose & replay a detector for an arbitrary rule ──────────────
$("propose").addEventListener("click", propose);
async function propose() {
  const rule = $("rule").value.trim();
  if (!rule) { toast(t("enter_rule_first")); $("rule").focus(); return; }
  $("propose").disabled = true; $("propose").textContent = t("replaying");
  $("result").innerHTML = `<div class="note"><span class="spinner" aria-hidden="true"></span>${esc(t("deriving_proving"))}</div>`;
  try {
    const d = await api("/api/propose", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rule }),
    });
    lastProposal = d.proposal;
    renderResult(d);
  } catch (e) { $("result").innerHTML = `<div class="note bad">✗ ${esc(e.message)}</div>`; toast(e.message, true); }
  finally { $("propose").disabled = false; $("propose").textContent = t("propose"); }
}

// Interpret-once: derive detectors for the project's advisory prose (LLM, bounded),
// each proven in the sandbox — the D-0016 "read prose once → kinded ruleset" step.
$("interpret").addEventListener("click", interpret);
async function interpret() {
  const btn = $("interpret");
  btn.disabled = true; btn.textContent = t("interpreting");
  $("result").innerHTML = `<div class="note"><span class="spinner" aria-hidden="true"></span>${esc(t("interpret_reading"))}</div>`;
  try {
    await api("/api/interpret", { method: "POST" });
    let d = { running: true };
    for (let i = 0; i < 300 && d.running; i++) {
      await new Promise((r) => setTimeout(r, 1000));
      d = await api("/api/interpret");
    }
    renderDerived(d.derived || []);
  } catch (e) { $("result").innerHTML = `<div class="note bad">✗ ${esc(e.message)}</div>`; toast(e.message, true); }
  finally { btn.disabled = false; btn.textContent = t("interpret"); }
}
function renderDerived(derived) {
  if (!derived.length) { $("result").innerHTML = `<div class="note">${esc(t("no_derived"))}</div>`; return; }
  const rows = derived.map((d) =>
    `<div class="hit"><span class="loc"><span class="kind">${esc(d.kind)}</span> ·${d.match_count} hit(s)</span><span class="ex">${esc(d.rule)}</span></div>`).join("");
  $("result").innerHTML =
    `<div class="proof">
       <div class="head">${t("interpreted_head", { n: derived.length })}</div>
       <div class="hits">${rows}</div>
       <p class="note">${esc(t("derived_note"))}</p>
       <button class="btn primary" id="persist-derived" type="button" style="width:100%">${esc(t("persist_cache"))}</button>
     </div>`;
  $("persist-derived").addEventListener("click", persistDerived);
}

// Cache the derived ruleset: preview the diff, confirm, then write it (ADR D-0016).
async function persistDerived() {
  const btn = $("persist-derived");
  btn.disabled = true; btn.textContent = t("previewing");
  try {
    const preview = await api("/api/interpret/persist", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dry_run: true }),
    });
    if (!preview.count) { toast(preview.note || t("nothing_to_persist")); btn.disabled = false; btn.textContent = t("persist_cache"); return; }
    if (!confirm(t("confirm_persist", { n: preview.count, file: preview.file }))) {
      btn.disabled = false; btn.textContent = t("persist_cache"); return;
    }
    const done = await api("/api/interpret/persist", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dry_run: false }),
    });
    btn.textContent = t("cached_ok", { n: done.count });
    toast(t("wrote_rules", { n: done.count, file: done.file }));
    runScan($("project").value && $("project").value !== "__all__" ? $("project").value : undefined);
  } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = t("persist_cache"); }
}

function renderResult(d) {
  const box = $("result");
  if (!d.proposal) {
    box.innerHTML = `<div class="note">${esc(d.note || t("no_proposal"))}</div>`;
    return;
  }
  const p = d.proposal, proof = d.proof;
  const hits = (proof.hits || []).slice(0, 40).map((h) =>
    `<div class="hit"><span class="loc">${esc(h.file)}:${h.line}</span><span class="ex">${esc(h.excerpt)}</span></div>`).join("");
  const patterns = [...(p.forbid || []), ...(p.forbid_regex || []).map((r) => r + " (regex)"), ...(p.file_regex || []).map((r) => r + " (file)")];
  box.innerHTML =
    `<div class="proof">
       <div class="head">${esc(t("proposed_tag"))} <span class="src-tag">${esc(p.source)}</span> · ${esc(JSON.stringify(patterns))}
         ${t("hits_across", { n: proof.match_count, files: proof.files_scanned })}</div>
       <div class="hits">${hits || `<div class="state">${esc(t("no_matches"))}</div>`}</div>
       <p class="note">${esc(t("review_hits"))}</p>
     </div>`;
}

// ── Toolbar wiring + init ────────────────────────────────────────────────────
// Filter and sort go in the URL, not just in memory: the standard treats an active
// filter as view state that must survive a reload, and putting it in the query
// string makes a filtered view shareable — paste the link, land on the same rows.
function readViewState() {
  const p = new URLSearchParams(location.search);
  const q = p.get("q");
  if (q) $("q").value = q;
  const s = p.get("sort");
  if (s && SORTS[viewMode] && SORTS[viewMode][s]) { sortKey[viewMode] = s; $("sort").value = s; }
}
function writeViewState() {
  const p = new URLSearchParams(location.search);
  const q = $("q").value.trim();
  q ? p.set("q", q) : p.delete("q");
  p.set("sort", sortKey[viewMode]);
  // replaceState, not pushState: typing a filter must not bury the previous view
  // under a history entry per keystroke. The hash (which project) stays the route.
  history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p : "") + location.hash);
}

$("q").addEventListener("input", () => {
  writeViewState();
  viewMode === "all" ? renderAllRows() : renderRules();
});
$("sort").addEventListener("change", () => {
  sortKey[viewMode] = $("sort").value;
  writeViewState();
  viewMode === "all" ? renderAllRows() : renderRules();
});

// Restore after the route has rendered, then re-render: the toolbar only exists
// once a view has been drawn, and applyRoute is what draws it.
loadProjects()
  .then(() => applyRoute(false))
  .then(() => {
    readViewState();
    if (!$("toolbar").hidden) viewMode === "all" ? renderAllRows() : renderRules();
  });
</script>
</body>
</html>
