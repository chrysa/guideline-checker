---
name: Deploy

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: Image tag to deploy (e.g. v1.2.0)
                required: true

permissions:
    contents: read
    packages: write

jobs:
    deploy:
        uses: chrysa/github-actions/.github/workflows/deploy.yml@v1.8.0
        with:
            image-base: ghcr.io/chrysa/guideline-checker
            tag: ${{ inputs.tag }}
            backend-context: .
            target: web
            # Stamp the real version into the wheel: setuptools-scm reads
            # SETUPTOOLS_SCM_PRETEND_VERSION from this build arg (Dockerfile), so
            # the image reports the release tag instead of the 0.0.0+unknown
            # fallback. On a release the tag name is used; workflow_dispatch passes
            # its own tag input. setuptools-scm normalises the leading `v`.
            backend-build-args: VERSION=${{ github.event.release.tag_name || inputs.tag }}
            gitops: true
            api-values-path: apps/dev/guideline-checker/values.yaml
        secrets:
            release-token: ${{ secrets.RELEASE_TOKEN }}
