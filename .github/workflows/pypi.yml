---
# Publish the package to TestPyPI, then PyPI, when a GitHub release is published.
#
# Trusted Publishing (OIDC): no API token is stored anywhere. Each publish job
# exchanges a short-lived GitHub OIDC token for a one-off PyPI upload token, which
# PyPI only grants to this repository, this workflow file and the named
# environment. Owner prerequisites (once):
#   - pypi.org and test.pypi.org: a (pending) Trusted Publisher for project
#     `guideline-checker`, owner `chrysa`, repository `guideline-checker`,
#     workflow `pypi.yml`, environment `pypi` (resp. `testpypi`);
#   - GitHub: environments `pypi` and `testpypi` (required reviewer recommended).
#
# The release itself is created by release.yml with RELEASE_TOKEN, so the
# `release: published` event fires (a GITHUB_TOKEN-created release would not).
# Only clean SemVer tags (vX.Y.Z) are published: GitVersion pseudo-prerelease
# tags such as v1.31.0-14 would otherwise reach PyPI as 1.31.0.post14.

name: Publish to PyPI

on:
    release:
        types: [published]

permissions:
    contents: read

concurrency:
    group: pypi-${{ github.event.release.tag_name }}
    cancel-in-progress: false

jobs:
    build:
        name: Build distributions
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            publish: ${{ steps.version.outputs.publish }}
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Resolve version from the release tag
              id: version
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                    echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
                    echo "publish=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "::notice::Tag '$TAG' is not a clean vX.Y.Z SemVer tag; nothing is published."
                    echo "publish=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Checkout the release tag
              if: steps.version.outputs.publish == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.release.tag_name }}
                  persist-credentials: false

            - name: Set up Python
              if: steps.version.outputs.publish == 'true'
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.14"

            - name: Build sdist and wheel
              if: steps.version.outputs.publish == 'true'
              env:
                  # The checkout is shallow: stamp the tag's version explicitly
                  # instead of letting setuptools-scm guess from partial history.
                  SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
              run: |
                  python -m pip install --upgrade "build==1.6.1" "twine==7.0.0"
                  python -m build
                  python -m twine check --strict dist/*
                  ls -l dist/

            - name: Upload distributions
              if: steps.version.outputs.publish == 'true'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: python-dist
                  path: dist/
                  if-no-files-found: error
                  retention-days: 7

    publish-testpypi:
        name: Publish to TestPyPI
        needs: build
        if: needs.build.outputs.publish == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: testpypi
            url: https://test.pypi.org/project/guideline-checker/${{ needs.build.outputs.version }}/
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download distributions
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: python-dist
                  path: dist/

            - name: Publish to TestPyPI (Trusted Publishing)
              uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
              with:
                  repository-url: https://test.pypi.org/legacy/

    publish-pypi:
        name: Publish to PyPI
        needs: [build, publish-testpypi]
        if: needs.build.outputs.publish == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: pypi
            url: https://pypi.org/project/guideline-checker/${{ needs.build.outputs.version }}/
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download distributions
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: python-dist
                  path: dist/

            - name: Publish to PyPI (Trusted Publishing)
              uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
