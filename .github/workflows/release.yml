---
name: Release

on:
    push:
        branches: [main, master]
        paths-ignore:
            - '**.md'
            - .github/**
    workflow_dispatch:

# The reusable release workflow requests contents: write to push the tag and
# create the GitHub release. The repository default token is read-only, so the
# caller must grant these scopes explicitly or the call fails at startup.
permissions:
    contents: write
    pull-requests: read

jobs:
    call:
        # v1.2.2 is the first release tag carrying the clean SemVer tagging fix
        # (majorMinorPatch instead of semVer). Replaces the interim SHA pin.
        uses: chrysa/github-actions/.github/workflows/release.yml@v1.2.2
        secrets: inherit
