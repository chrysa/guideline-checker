name: Security vulnerability
description: Report a security issue or vulnerability (do NOT disclose publicly)
title: 'security: '
labels:
  - security
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Brief description — do NOT include exploit details in public issues
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected component
      description: File, endpoint, dependency, etc.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What could an attacker do?
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: If known, patch, version bump, config change
  - type: textarea
    id: references
    attributes:
      label: References
      description: CVE, GHSA, SonarCloud finding ID, etc.
