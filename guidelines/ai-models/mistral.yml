model_target: mistral
rules:
- category: architecture
  id: mistral-tool-calling
  rationale: Native tool calls are validated by the API; hand-rolled JSON in prose
    is not
  rule: Use native function calling for tool use, never prompt-encoded JSON conventions
  severity: warning
- category: prompt-format
  id: mistral-no-system-priming
  rationale: Role-based prompting is more robust than conversational priming tricks
  rule: Keep instructions in dedicated roles rather than priming through a fake assistant
    turn
  severity: info
