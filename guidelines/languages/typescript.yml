apply_to_glob: '**/*.ts,**/*.tsx'
language_target: typescript
rules:
- category: stack
  id: ts-strict-types
  rationale: any disables the type checker
  rule: Prefer precise types over the any escape hatch
  severity: error
  detect:
    # AST: an `any` type node (annotation, `as any`, generic arg) — never a false
    # positive on the word "any" inside a string or identifier.
    ast:
    - ts-any-type
- category: stack
  id: ts-no-suppressions
  rationale: Suppression comments hide real type bugs
  rule: Resolve type errors instead of suppressing them
  severity: warning
  detect:
    # AST: a @ts-ignore / @ts-nocheck comment (not @ts-expect-error, which self-clears).
    ast:
    - ts-suppression
- category: stack
  id: ts-no-non-null-assertion
  rationale: The non-null assertion asserts non-null without proof, defeating strict null checks
  rule: Prove non-null with a check instead of asserting it with the non-null operator
  severity: warning
  detect:
    # AST: a postfix `x!` non_null_expression — distinct from `!x` and `!=`/`!==`.
    ast:
    - ts-non-null-assertion
- category: correctness
  id: ts-no-console-log
  rationale: console.log/debug is unstructured and leaks into production bundles
  rule: Use a logger instead of console.log or console.debug
  severity: warning
  detect:
    forbid_regex:
    - 'console\.(log|debug)\s*\('
- category: stack
  id: ts-no-var
  rationale: var is function-scoped and hoisted; const/let are block-scoped and safer
  rule: Declare bindings with const or let, never var
  severity: warning
  detect:
    forbid_regex:
    - '(^|[^.\w])var\s+[A-Za-z_$]'
  fix:
    op: regex_replace
    pattern: '\bvar\b'
    replacement: 'const'
- category: correctness
  id: ts-no-debugger
  rationale: A committed debugger statement halts execution in the browser
  rule: Remove debugger statements before committing
  severity: warning
  detect:
    forbid_regex:
    - '\bdebugger\b'
- category: security
  id: ts-no-eval
  rationale: eval on runtime data is a direct code-execution vector
  rule: Never use eval() on runtime data in TypeScript
  severity: error
  detect:
    forbid:
    - 'eval('
- category: architecture
  id: ts-provider-sdk-direct
  rationale: "LLM001 — a direct vendor SDK import in feature code is provider lock-in; route calls through a declared adapter (opt out in an adapter via a `guideline: disable` comment). Ships warning-first per the Mark-L progressive rollout."
  rule: Route AI provider calls through a provider adapter, never import a vendor SDK directly in feature code
  severity: warning
  detect:
    forbid_regex:
    - '(from|require\s*\()\s*[''"](openai|cohere-ai|groq-sdk|@anthropic-ai/sdk|@mistralai/mistralai|@google/(generative-ai|genai))[''"]'
