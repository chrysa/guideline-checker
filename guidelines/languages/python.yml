apply_to_glob: '**/*.py'
language_target: python
rules:
- category: stack
  id: py-pydantic-v2
  rationale: chrysa stack convention
  rule: Use Pydantic v2 models exclusively; v1 syntax is forbidden
  severity: error
  detect:
    # AST: real v1 imports / @validator decorators only — no false positives on
    # the same text inside a string literal or comment.
    ast:
    - pydantic-v1
- category: stack
  id: py-async-fastapi
  rationale: Consistent non-blocking I/O
  rule: Define FastAPI route handlers as async def
  severity: warning
  detect:
    # AST: a route decorator on a plain (non-async) handler, robust to spacing
    # and multiline decorator arguments.
    ast:
    - sync-fastapi-route
- category: stack
  id: py-structured-logging
  rationale: Structured logging beats ad-hoc stdout writes in production
  rule: Emit operational output through the logging module
  severity: warning
  detect:
    forbid:
    - 'print('
    - 'pprint('
- category: correctness
  id: py-no-mutable-default
  rationale: A shared mutable default is reused across calls — a classic aliasing bug
  rule: Do not use mutable default arguments; default to None and build inside the body
  severity: warning
  detect:
    # AST: a [] / {} / set()/list()/dict() default — precise, unlike a '=[]' substring.
    ast:
    - mutable-default-arg
- category: correctness
  id: py-no-bare-except
  rationale: A bare except swallows KeyboardInterrupt/SystemExit and hides real failures
  rule: Catch specific exceptions, never a bare except
  severity: warning
  detect:
    forbid_regex:
    - '^\s*except\s*:'
- category: correctness
  id: py-no-wildcard-import
  rationale: Wildcard imports pollute the namespace and hide a symbol's origin
  rule: Import names explicitly, never with a wildcard star import
  severity: warning
  detect:
    forbid_regex:
    - '^\s*from\s+[\w.]+\s+import\s+\*'
- category: security
  id: py-no-eval-exec
  rationale: eval/exec on runtime data is a direct code-execution vector
  rule: Never use eval() or exec() on runtime data
  severity: error
  detect:
    forbid:
    - 'eval('
    - 'exec('
- category: security
  id: py-no-shell-true
  rationale: shell=True turns unsanitised input into a shell-injection vector
  rule: Never spawn a subprocess with shell=True
  severity: error
  detect:
    forbid_regex:
    - 'shell\s*=\s*True'
- category: security
  id: py-no-os-system
  rationale: os.system runs a shell string; subprocess with a list avoids injection
  rule: Use the subprocess module instead of os.system()
  severity: error
  detect:
    forbid:
    - 'os.system('
- category: security
  id: py-safe-yaml
  rationale: yaml.load without SafeLoader can instantiate arbitrary Python objects
  rule: Parse YAML with safe_load, never the unsafe yaml.load
  severity: warning
  detect:
    forbid:
    - 'yaml.load('
  fix:
    op: replace
    from: 'yaml.load('
    to: 'yaml.safe_load('
- category: correctness
  id: py-no-debugger
  rationale: A committed breakpoint halts execution in production
  rule: Remove debugger entry points before committing
  severity: warning
  detect:
    forbid:
    - 'breakpoint('
    - 'pdb.set_trace('
  fix:
    op: remove_line
