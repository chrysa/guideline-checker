apply_to_glob: '**/*.py'
include:
- packs/security-strict.yml
language_target: python
rules:
- extends: base-weak-hash
  id: py-no-weak-hash
  severity: error
- category: correctness
  detect:
    ast:
    - assert-as-validation
    exclude:
    - tests
    - '**/test_*.py'
    - '**/conftest.py'
  id: py-no-assert-as-validation
  rationale: Python strips assert under -O, so a guard written that way disappears
    in production while the code around it still assumes it ran
  rule: Do not use assert to guard runtime behaviour outside tests
  severity: warning
- category: correctness
  detect:
    ast:
    - silent-exception
  id: py-no-silent-exception
  rationale: A discarded failure lets the program carry on with wrong state, and leaves
    nothing behind to explain how it got there
  rule: Never catch an exception broadly and discard it without a trace
  severity: error
- category: stack
  detect:
    ast:
    - pydantic-v1
  id: py-pydantic-v2
  rationale: chrysa stack convention
  rule: Use Pydantic v2 models exclusively; v1 syntax is forbidden
  severity: error
- category: stack
  detect:
    ast:
    - sync-fastapi-route
  id: py-async-fastapi
  rationale: Consistent non-blocking I/O
  rule: Define FastAPI route handlers as async def
  severity: warning
- category: stack
  detect:
    forbid:
    - print(
    - pprint(
  id: py-structured-logging
  rationale: Structured logging beats ad-hoc stdout writes in production
  rule: Emit operational output through the logging module
  severity: warning
- category: correctness
  detect:
    ast:
    - mutable-default-arg
  id: py-no-mutable-default
  rationale: "A shared mutable default is reused across calls \u2014 a classic aliasing\
    \ bug"
  rule: Do not use mutable default arguments; default to None and build inside the
    body
  severity: warning
- category: correctness
  detect:
    forbid_regex:
    - '^\s*except\s*:'
  id: py-no-bare-except
  rationale: A bare except swallows KeyboardInterrupt/SystemExit and hides real failures
  rule: Catch specific exceptions, never a bare except
  severity: warning
- category: correctness
  detect:
    forbid_regex:
    - ^\s*from\s+[\w.]+\s+import\s+\*
  id: py-no-wildcard-import
  rationale: Wildcard imports pollute the namespace and hide a symbol's origin
  rule: Import names explicitly, never with a wildcard star import
  severity: warning
- category: security
  detect:
    forbid:
    - eval(
    - exec(
  id: py-no-eval-exec
  rationale: eval/exec on runtime data is a direct code-execution vector
  rule: Never use eval() or exec() on runtime data
  severity: error
- category: security
  detect:
    forbid_regex:
    - shell\s*=\s*True
  id: py-no-shell-true
  rationale: shell=True turns unsanitised input into a shell-injection vector
  rule: Never spawn a subprocess with shell=True
  severity: error
- category: security
  detect:
    forbid:
    - os.system(
  id: py-no-os-system
  rationale: os.system runs a shell string; subprocess with a list avoids injection
  rule: Use the subprocess module instead of os.system()
  severity: error
- category: security
  detect:
    forbid:
    - yaml.load(
  fix:
    from: yaml.load(
    op: replace
    to: yaml.safe_load(
  id: py-safe-yaml
  rationale: yaml.load without SafeLoader can instantiate arbitrary Python objects
  rule: Parse YAML with safe_load, never the unsafe yaml.load
  severity: warning
- category: correctness
  detect:
    forbid:
    - breakpoint(
    - pdb.set_trace(
  fix:
    op: remove_line
  id: py-no-debugger
  rationale: A committed breakpoint halts execution in production
  rule: Remove debugger entry points before committing
  severity: warning
- category: architecture
  detect:
    forbid_regex:
    - '^\s*(import|from)\s+(openai|anthropic|cohere|groq|mistralai)([\s.]|$)'
    - '^\s*(import|from)\s+google\.(generativeai|genai)'
  id: py-provider-sdk-direct
  rationale: "LLM001 — a direct vendor SDK import in feature code is provider lock-in; route calls through a declared adapter (allowed in an adapter or ai-aggregator via a `# guideline: disable` comment). Promoted to error after a 0-false-positive report pass on floating-agent/pilote-paperclip/dev-nexus."
  rule: Route AI provider calls through a provider adapter, never import a vendor SDK directly in feature code
  severity: error
