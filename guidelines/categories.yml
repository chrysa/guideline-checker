# Shared category registry for the multi-dimension rule referential.
# Every rule's `category` MUST exist here — the loader fails on an unknown one.
# Defined once so every guidelines/ dimension shares one category vocabulary.
categories:
  - id: prompt-format
    description: "Prompt and instruction formatting"
  - id: architecture
    description: "Architecture decisions (seams, abstractions, lock-in)"
  - id: stack
    description: "Stack choices and pinned versions"
  - id: naming
    description: "Naming conventions"
  - id: testing
    description: "Testing practices"
  - id: security
    description: "Security and secrets"
  - id: correctness
    description: "Correctness and common bug patterns"
