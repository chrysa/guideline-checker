branches:
  chore:
    increment: Patch
    mode: ContinuousDeployment
    regex: ^chore/
    tag: alpha
  feature:
    increment: Minor
    mode: ContinuousDeployment
    regex: ^feat/
    tag: alpha
  fix:
    increment: Patch
    mode: ContinuousDeployment
    regex: ^fix/
    tag: beta
  main:
    increment: Patch
    mode: ContinuousDelivery
    regex: ^main$
    tag: ''
increment: Inherit
major-version-bump-message: ^(feat|fix|refactor)(\(.+\))?!:.+
minor-version-bump-message: ^feat(\(.+\))?:.+
# Fallback mode for the main line: ContinuousDelivery keeps the build height in
# build metadata (1.0.0+148) instead of a pre-release suffix (1.0.0-148), so the
# released tag is a clean SemVer. Feature/fix/chore branches keep
# ContinuousDeployment for their alpha/beta pre-releases.
mode: ContinuousDelivery
patch-version-bump-message: ^(fix|refactor|perf|docs|chore)(\(.+\))?:.+
