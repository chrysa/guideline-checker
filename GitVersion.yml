# GitVersion 6: main releases are plain SemVer (vX.Y.Z), published to PyPI and Docker Hub.
next-version: 1.32.0
branches:
  chore:
    increment: Patch
    mode: ContinuousDeployment
    regex: ^chore/
    label: alpha
  feature:
    increment: Minor
    mode: ContinuousDeployment
    regex: ^feat/
    label: alpha
  fix:
    increment: Patch
    mode: ContinuousDeployment
    regex: ^fix/
    label: beta
  main:
    increment: Patch
    mode: ContinuousDeployment
    regex: ^main$
    label: ''
increment: Inherit
major-version-bump-message: ^(feat|fix|refactor)(\(.+\))?!:.+
minor-version-bump-message: ^feat(\(.+\))?:.+
mode: ContinuousDeployment
patch-version-bump-message: ^(fix|refactor|perf|docs|chore)(\(.+\))?:.+
