default_language_version:
  python: python3.14
exclude: ^\.claude/(?!(skills|agents)/)
fail_fast: false
minimum_pre_commit_version: 4.1.0
repos:
- hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - args:
    - --unsafe
    exclude: ^\.github/ISSUE_TEMPLATE/
    id: check-yaml
  - id: check-toml
  - id: debug-statements
  - id: check-merge-conflict
  - id: detect-private-key
  - args:
    - --branch
    - main
    id: no-commit-to-branch
  - id: check-json
  repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
- hooks:
  - args:
    - --fix
    id: ruff
  - id: ruff-format
  repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.22
- hooks:
  - id: mypy
    stages:
    - manual
  repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.3.0
- hooks:
  - id: makefile-check
  - exclude: ^(tests/|scripts/|guideline_checker/(cli|checker|init_cmd)\.py$)
    id: python-print-detection
  - exclude: ^(tests/|guideline_checker/checker\.py$)
    id: python-pprint-detection
  - id: python-unreachable-code
  - exclude: ^\.github/(workflows|ISSUE_TEMPLATE)/|^\.github/dependabot\.yml$
    id: yaml-sorter
  - id: adr-gate
  - exclude: ^tests/
    id: no-bare-except
  - id: python-logger-detection
  - id: no-sync-in-async
  - exclude: ^(tests/|README\.md$|DECISIONS\.md$|guidelines/)
    id: debugger-detection
  - id: fastapi-missing-response-model
  - exclude: ^tests/
    id: console-log-detection
  - id: console-debug-detection
  - id: no-console-warn
  - id: ts-unreachable-code
  - id: dockerfile-no-latest
  - id: regression-gate
    stages:
    - pre-push
  - id: json-sorter
  - id: env-file-check
  - id: env-example-sync
  - exclude: tests?/|\.test\.|\.spec\.|^guideline_checker/(proposer\.py$|web/app\.py$)
    id: no-hardcoded-localhost
  - exclude: ^tests/
    id: fastapi-missing-links
  - id: claude-skill-frontmatter
  - id: claude-agent-frontmatter
  - id: claude-mcp-config
  repo: https://github.com/chrysa/pre-commit-tools
  rev: v0.1.1-98
- hooks:
  - id: gitleaks
  repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
- hooks:
  - args:
    - feat
    - fix
    - docs
    - style
    - refactor
    - test
    - chore
    - perf
    - revert
    - ci
    id: conventional-pre-commit
    stages:
    - commit-msg
  repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.4.0
- hooks:
  - entry: make docker-test
    id: run-tests
    language: system
    name: run test suite (with coverage)
    pass_filenames: false
    stages:
    - pre-push
  - entry: bash -c 'docker run --rm --env SONAR_TOKEN -v "$(pwd):/usr/src" sonarsource/sonar-scanner-cli:11
      -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=chrysa -Dsonar.projectKey=chrysa_guideline-checker
      -Dsonar.python.coverage.reportPaths=reports/coverage.xml -Dsonar.python.xunit.reportPath=reports/junit.xml'
    id: sonar-scanner
    language: system
    name: sonar cloud analysis
    pass_filenames: false
    stages:
    - pre-push
  repo: local
- hooks:
  - args:
    - --fix
    id: markdownlint
    stages:
    - manual
  repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.1
- repo: https://github.com/chrysa/guideline-checker
  rev: v1.15.0
  hooks:
  - id: guideline-check
