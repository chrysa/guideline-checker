services:
  lint:
    build:
      context: .
      dockerfile: Dockerfile
      target: lint
    container_name: guideline-checker-lint
    environment:
    - PYTHONDONTWRITEBYTECODE=1
    - PYTHONUNBUFFERED=1
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: guideline-checker-test
    environment:
    - PYTHONDONTWRITEBYTECODE=1
    - PYTHONUNBUFFERED=1
    volumes:
    - ./coverage.xml:/app/coverage.xml
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: guideline-checker-web
    environment:
    - PYTHONDONTWRITEBYTECODE=1
    - PYTHONUNBUFFERED=1
    - SCAN_ROOT=/workspace
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 15s
      test: CMD curl -f http://localhost:8080/health
      timeout: 10s
    ports:
    - 8080:8080
    restart: unless-stopped
    volumes:
    - .:/workspace:ro
