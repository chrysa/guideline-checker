name: guideline-checker
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    environment:
    - PYTHONDONTWRITEBYTECODE=1
    - PYTHONUNBUFFERED=1
    - SCAN_ROOT=/workspace
    - HOME=/tmp
    - PYTHONPYCACHEPREFIX=/tmp/.toolcache/pycache
    - RUFF_CACHE_DIR=/tmp/.toolcache/ruff
    - MYPY_CACHE_DIR=/tmp/.toolcache/mypy
    - PYTEST_ADDOPTS=-p no:cacheprovider
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 15s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      timeout: 10s
    ports:
    - 8080:8080
    restart: unless-stopped
    user: ${UID:-1000}:${GID:-1000}
    volumes:
    - .:/workspace:ro
  lint:
    build:
      context: .
      dockerfile: Dockerfile
      target: lint
    environment:
    - PYTHONDONTWRITEBYTECODE=1
    - PYTHONUNBUFFERED=1
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
    # coverage writes its SQLite database beside the working directory, and /app is
    # root-owned in the image. Since the service runs as the host UID, that write is
    # denied and pytest dies with "unable to open database file" — after the tests
    # have already passed. Point the database at a world-writable path; the XML report
    # still lands on the bind mount below, which the host owns.
    - COVERAGE_FILE=/tmp/.coverage
    - PYTHONDONTWRITEBYTECODE=1
    - PYTHONUNBUFFERED=1
    user: ${UID:-1000}:${GID:-1000}
    volumes:
    - ./coverage.xml:/app/coverage.xml
