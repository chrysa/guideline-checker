# fleet-scan — skill recommendations (owned by the standards lot, L2).
#
# Skills are RECOMMENDATIONS, never obligations: no rule fails because a skill is absent,
# and the scanner does not check skill presence. A report may print "suggested skill"
# next to a failed related rule. Profile names below are conformance.yaml profiles.
#
# Distribution canon: shared-standards `.claude/skills/skills-profiles.yml` (ADR D-0013,
# status Proposed) scopes the fan-out by repos.yml profiles (ai/back/front/infra/lib/config);
# translation used here: back→python|app, front→node, infra→container|infra, lib→lib,
# ai→python, all→all. That translation is approximate (repos.yml profiles are declared,
# ours are detected).
# Note: `applies_to_profiles` / `related_rule_ids` are not walked by the engine's
# cross-check (it only reads rule(s)/rule_id(s)/profile(s) keys); L2 validated them offline.

schema_version: "1.0"
