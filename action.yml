author: chrysa
branding:
  color: blue
  icon: check-circle
description: 'Check project compliance against .github/instructions/ rules. Generates
  SARIF (GitHub Code Scanning), Markdown, and HTML reports.

  '
inputs:
  exclude:
    default: ''
    description: 'Comma-separated globs (relative to root) to skip. A bare directory
      name excludes everything beneath it. Example: tests, scripts/**, **/*.md

      '
    required: false
  fail-on:
    default: error
    description: 'Severity threshold that causes the action to fail. Accepted values:
      error | warning | never.

      '
    required: false
  instructions:
    default: ''
    description: 'Path to the instructions directory. Defaults to <root>/.github/instructions.

      '
    required: false
  python-version:
    default: '3.14'
    description: Python version used to install and run guideline-checker.
    required: false
  root:
    default: ${{ github.workspace }}
    description: Project root directory (defaults to repository root).
    required: false
  sarif-output:
    default: guideline-results.sarif
    description: Path to write the SARIF 2.1.0 report.
    required: false
  upload-sarif:
    default: 'true'
    description: Upload SARIF to GitHub Code Scanning (requires security-events write
      permission).
    required: false
name: Guideline Checker
outputs:
  sarif-path:
    description: Absolute path to the generated SARIF report.
    value: ${{ steps.run.outputs.sarif-path }}
  violations:
    description: Total number of violations found.
    value: ${{ steps.run.outputs.violations }}
runs:
  steps:
  - name: Set up Python
    uses: actions/setup-python@v7
    with:
      python-version: ${{ inputs.python-version }}
  - name: Install guideline-checker
    run: pip install --quiet "${{ github.action_path }}"
    shell: bash
  - env:
      GC_EXCLUDE: ${{ inputs.exclude }}
      GC_FAIL_ON: ${{ inputs.fail-on }}
      GC_INSTRUCTIONS: ${{ inputs.instructions }}
      GC_ROOT: ${{ inputs.root }}
      GC_SARIF: ${{ inputs.sarif-output }}
    id: run
    name: Run guideline-checker
    run: |
      ARGS=(check --root "$GC_ROOT" --sarif "$GC_SARIF" --markdown guideline-report.md --json guideline-report.json)

      if [[ -n "$GC_INSTRUCTIONS" ]]; then
        ARGS+=(--instructions "$GC_INSTRUCTIONS")
      fi

      if [[ -n "$GC_EXCLUDE" ]]; then
        IFS=',' read -ra _EXCLUDES <<< "$GC_EXCLUDE"
        for _glob in "${_EXCLUDES[@]}"; do
          _glob="$(echo "$_glob" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          [[ -n "$_glob" ]] && ARGS+=(--exclude "$_glob")
        done
      fi

      ARGS+=(--fail-on "$GC_FAIL_ON")

      set +e
      OUTPUT=$(guideline-checker "${ARGS[@]}" 2>&1)
      EXIT_CODE=$?
      set -e

      echo "$OUTPUT"

      VIOLATIONS=$(echo "$OUTPUT" | grep -oP '\d+(?= violation)' | head -1 || echo "0")
      echo "violations=${VIOLATIONS:-0}" >> "$GITHUB_OUTPUT"
      echo "sarif-path=$(realpath "$GC_SARIF" 2>/dev/null || echo "$GC_SARIF")" >> "$GITHUB_OUTPUT"

      exit $EXIT_CODE
    shell: bash
  - if: ${{ inputs.upload-sarif == 'true' && !cancelled() }}
    name: Upload SARIF to GitHub Code Scanning
    uses: github/codeql-action/upload-sarif@v4
    with:
      category: guideline-checker
      sarif_file: ${{ inputs.sarif-output }}
  - if: ${{ !cancelled() }}
    name: Upload Markdown report as artifact
    uses: actions/upload-artifact@v7
    with:
      if-no-files-found: warn
      name: guideline-report
      path: 'guideline-report.md

        guideline-report.json

        ${{ inputs.sarif-output }}

        '
  using: composite
