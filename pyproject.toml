[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guideline-checker"
# Version is derived from git tags by setuptools-scm (never bumped manually — D-0009).
# Builds without a .git (e.g. the Docker image) use fallback_version, or the
# SETUPTOOLS_SCM_PRETEND_VERSION env var when the release/deploy stamps the tag.
dynamic = ["version"]
description = "Check project compliance against GitHub Copilot instruction rules and generate HTML reports"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "chrysa" }]
keywords = [
    "copilot",
    "instructions",
    "compliance",
    "guidelines",
    "linting",
    "report",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    # Parses the structured YAML rule referential (guidelines/<dimension>/*.yml).
    "PyYAML>=6",
    # Precise JS/TS/JSX/TSX detection for detect.ast checks (see ADR D-0006).
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "ldap3>=2.9",
    "httpx>=0.27",
    "PyJWT>=2.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.10",
    "types-PyYAML>=6",
    "httpx2>=2.7",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]
e2e = ["playwright>=1.48", "pytest-playwright>=0.5"]

[project.scripts]
guideline-checker = "guideline_checker.cli:main"

[project.urls]
Homepage = "https://github.com/chrysa/guideline-checker"
Repository = "https://github.com/chrysa/guideline-checker"
Issues = "https://github.com/chrysa/guideline-checker/issues"
Changelog = "https://github.com/chrysa/guideline-checker/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["guideline_checker*"]

[tool.setuptools.package-data]
guideline_checker = ["web/static/*"]

[tool.setuptools_scm]
# No .git (Docker build context excludes it) and no SETUPTOOLS_SCM_PRETEND_VERSION
# → fall back to this instead of failing the build.
fallback_version = "0.0.0+unknown"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=guideline_checker --cov-report=xml --cov-report=term-missing --cov-fail-under=85 --ignore=tests/e2e -p no:query_optimizer"

[tool.coverage.run]
source = ["guideline_checker"]
branch = true
# Emit repo-relative file paths in coverage.xml so SonarCloud can map them
# to source files (otherwise paths are absolute and resolve to nothing).
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.guideline-checker]
baseline = ".guideline-baseline.json"

[[tool.mypy.overrides]]
module = "cryptography.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jwt"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ldap3"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tree_sitter_javascript", "tree_sitter_typescript"]
ignore_missing_imports = true
