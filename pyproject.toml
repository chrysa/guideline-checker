[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guideline-checker"
# Version is derived from git tags by setuptools-scm (never bumped manually — D-0019).
# Builds without a .git (e.g. the Docker image) use fallback_version, or the
# SETUPTOOLS_SCM_PRETEND_VERSION env var when the release/deploy stamps the tag.
dynamic = ["version"]
description = "Check project compliance against GitHub Copilot instruction rules and generate HTML reports"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "chrysa" }]
keywords = [
    "copilot",
    "instructions",
    "compliance",
    "guidelines",
    "linting",
    "report",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    # Parses the structured YAML rule referential (guidelines/<dimension>/*.yml).
    "PyYAML>=6",
    # Precise JS/TS/JSX/TSX detection for detect.ast checks (see ADR D-0006).
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "ldap3>=2.9",
    "httpx>=0.27",
    "PyJWT>=2.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Mandated by the standard in place of unittest.mock, and absent until now —
    # which is precisely why the suite still reached for unittest.mock.
    "pytest-mock>=3.14",
    "ruff>=0.9",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "types-PyYAML>=6",
    "httpx2>=2.7",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]
e2e = ["playwright>=1.48", "pytest-playwright>=0.5"]
workshop = []  # LLM detector authoring (proposer/persist/interpret) — no extra deps today;
               # reserved for a future LLM SDK so it never lands in the default install.
fleet = []     # gh-backed multi-repo governance — no extra deps today (gh_client shells to
               # the `gh` CLI); reserved so a future PyGithub dependency never lands by default.

[project.scripts]
guideline-checker = "guideline_checker.cli:main"

[project.urls]
Homepage = "https://github.com/chrysa/guideline-checker"
Repository = "https://github.com/chrysa/guideline-checker"
Issues = "https://github.com/chrysa/guideline-checker/issues"
Changelog = "https://github.com/chrysa/guideline-checker/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["guideline_checker*"]

[tool.setuptools.package-data]
guideline_checker = ["web/static/*"]

[tool.setuptools_scm]
# No .git (Docker build context excludes it) and no SETUPTOOLS_SCM_PRETEND_VERSION
# → fall back to this instead of failing the build.
fallback_version = "0.0.0+unknown"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=guideline_checker --cov-report=xml --cov-report=term-missing --cov-fail-under=85 --ignore=tests/e2e -p no:query_optimizer"

[tool.coverage.run]
source = ["guideline_checker"]
branch = true
# Emit repo-relative file paths in coverage.xml so SonarCloud can map them
# to source files (otherwise paths are absolute and resolve to nothing).
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # bandit security
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "PERF", # performance
    "C901",
    "PLR0402",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "PLR1714",
    "PLR1730",
    "PLR5501",
    "PLR2004",
]
ignore = [
    "S101",    # use of assert (sanctioned by chrysa standard)
    # S603 is a non-actionable advisory: it fires on *every* subprocess.run /
    # Popen call regardless of how the arguments are built, and ruff/bandit
    # offer no code-level way to clear it. The real injection surface is
    # eliminated in code instead — no shell=True (S602) and every executable is
    # resolved to an absolute path via shutil.which (S607). All argv vectors are
    # static or come from trusted local config, never from untrusted input.
    "S603",    # subprocess call — advisory only; risk handled via shell=False + shutil.which
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "S104"]
"tests/fixtures/**" = ["ANN", "S101", "S104", "S307", "S110", "E722", "S108"]
# seed.py embeds detection patterns (e.g. "0.0.0.0") intentionally — not a real binding
"guideline_checker/core/derive/seed.py" = ["S104"]
# __init__.py defines Violation/RuleResult before importing .pattern/.numeric/.presence,
# which themselves construct Violation — the submodule imports must come after those
# classes are defined to avoid a real circular import, hence E402 here is deliberate.
"guideline_checker/core/detection/__init__.py" = ["E402"]
"**/tests/**" = ["PLR2004"]
"**/test_*.py" = ["PLR2004"]
"**/conftest.py" = ["PLR2004"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.guideline-checker]
baseline = ".guideline-baseline.json"

[[tool.mypy.overrides]]
module = "cryptography.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jwt"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ldap3"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tree_sitter_javascript", "tree_sitter_typescript"]
ignore_missing_imports = true
